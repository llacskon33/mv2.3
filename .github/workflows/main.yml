name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # 1. Clean temporary files and measure disk space
      - name: Clean Windows and Check Disk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          function Show-DiskSpace {
            Get-CimInstance Win32_LogicalDisk `
              -Filter "DeviceID='C:'" |
              Select-Object DeviceID,
                @{N='TotalGB';E={[math]::Round($_.Size/1GB,2)}},
                @{N='FreeGB';E={[math]::Round($_.FreeSpace/1GB,2)}} |
              Format-Table -AutoSize
          }

          Write-Host "=== DISK BEFORE CLEANUP ==="
          Show-DiskSpace

          $paths = @(
            $env:TEMP,
            "$env:WINDIR\Temp"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Get-ChildItem -LiteralPath $path -Force `
                -ErrorAction SilentlyContinue |
                Remove-Item -Recurse -Force `
                -ErrorAction SilentlyContinue
            }
          }

          DISM.exe /Online /Cleanup-Image /StartComponentCleanup

          Write-Host "=== DISK AFTER CLEANUP ==="
          Show-DiskSpace

      # 2. Generate a random password and configure the RDP user
      - name: Create RDP User and Generate Password
        id: credentials
        shell: pwsh
        run: |
          $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'.ToCharArray()
          $lower = 'abcdefghijkmnopqrstuvwxyz'.ToCharArray()
          $digits = '23456789'.ToCharArray()
          $special = '!@#$%&*_-+'.ToCharArray()

          $all = $upper + $lower + $digits + $special
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

          function Get-SecureChar($set) {
            $bytes = New-Object byte[] 4
            $rng.GetBytes($bytes)
            $number = [BitConverter]::ToUInt32($bytes, 0)
            return $set[[int]($number % $set.Length)]
          }

          $passwordChars = @()
          $passwordChars += Get-SecureChar $upper
          $passwordChars += Get-SecureChar $lower
          $passwordChars += Get-SecureChar $digits
          $passwordChars += Get-SecureChar $special

          for ($i = 4; $i -lt 24; $i++) {
            $passwordChars += Get-SecureChar $all
          }

          $password = -join ($passwordChars | Sort-Object { Get-Random })
          $rng.Dispose()

          # Mask the password in GitHub Actions logs
          Write-Output "::add-mask::$password"

          $securePassword = ConvertTo-SecureString `
            $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name RDP `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
            Set-LocalUser -Name RDP -Password $securePassword
          } else {
            New-LocalUser -Name RDP `
              -Password $securePassword `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member RDP `
            -ErrorAction SilentlyContinue

          # Pass credentials to later steps within this job
          "password=$password" >> $env:GITHUB_OUTPUT

          Write-Host "RDP account configured."
          Write-Host "Password generated and masked."

      # 3. Configure Remote Desktop
      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Start-Service -Name TermService

          Write-Host "RDP configured with NLA enabled."

      # 4. Install Tailscale
      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed."
          }

      # 5. Connect to the private Tailscale network
      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing TAILSCALE_AUTH_KEY repository secret."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up "--authkey=$env:TS_AUTHKEY" `
            "--hostname=gh-rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $ip = $null

          for ($i = 0; $i -lt 12 -and -not $ip; $i++) {
            Start-Sleep -Seconds 5
            $ip = (& $ts ip -4 | Select-Object -First 1).Trim()
          }

          if (-not $ip) {
            throw "No Tailscale IP assigned."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Tailscale connected."

      # 6. Check RDP connectivity
      - name: Verify RDP
        shell: pwsh
        run: |
          $ready = $false

          for ($i = 0; $i -lt 12; $i++) {
            $result = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389 `
              -WarningAction SilentlyContinue

            if ($result.TcpTestSucceeded) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw "RDP port 3389 is not reachable."
          }

          Write-Host "RDP connectivity verified."

      # 7. Display connection details in the run summary
      - name: Publish Connection Details
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ steps.credentials.outputs.password }}
        run: |
          @"
          # RDP Connection Details

          - **Address:** $env:TAILSCALE_IP
          - **Username:** RDP
          - **Password:** $env:RDP_PASSWORD

          Keep these credentials private. The password changes on every run.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 -Append

          Write-Host "Connection details added to the run summary."

      # 8. Keep the session alive for the job's allowed duration
      - name: Keep Session Alive
        shell: pwsh
        run: |
          Write-Host "RDP session is active."
          Write-Host "The workflow will end when its time limit is reached."

          while ($true) {
            Start-Sleep -Seconds 300
          } 
