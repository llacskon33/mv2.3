name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Clean Windows and Check Disk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=== DISK BEFORE CLEANUP ==="
          Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'" |
            Select-Object DeviceID,
              @{N='TotalGB';E={[math]::Round($_.Size/1GB,2)}},
              @{N='FreeGB';E={[math]::Round($_.FreeSpace/1GB,2)}}

          # Clean temporary files
          $paths = @($env:TEMP, "$env:WINDIR\Temp")

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Get-ChildItem -LiteralPath $path -Force `
                -ErrorAction SilentlyContinue |
                Remove-Item -Recurse -Force `
                -ErrorAction SilentlyContinue
            }
          }

          # Clean Windows component store
          DISM.exe /Online /Cleanup-Image /StartComponentCleanup

          Write-Host "=== DISK AFTER CLEANUP ==="
          Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'" |
            Select-Object DeviceID,
              @{N='TotalGB';E={[math]::Round($_.Size/1GB,2)}},
              @{N='FreeGB';E={[math]::Round($_.FreeSpace/1GB,2)}}

      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

      - name: Create RDP User
        shell: pwsh
        run: |
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
            throw "Configure the RDP_PASSWORD GitHub secret first."
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name RDP -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name RDP -Password $securePass
          } else {
            New-LocalUser -Name RDP -Password $securePass `
              -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member RDP -ErrorAction SilentlyContinue

          # Administrator privileges are not required for basic RDP.
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Configure the TAILSCALE_AUTH_KEY GitHub secret first."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up "--authkey=$env:TS_AUTHKEY" `
            "--hostname=gh-rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $ip = & $ts ip -4
          if (-not $ip) {
            throw "No Tailscale IP was assigned."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "RDP address: $ip"

      - name: Verify RDP
        shell: pwsh
        run: |
          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP -Port 3389

          if (-not $result.TcpTestSucceeded) {
            throw "RDP port 3389 is not reachable."
          }

          Write-Host "RDP connectivity verified."

      - name: Keep Session Alive
        shell: pwsh
        run: |
          Write-Host "RDP address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Use your RDP_PASSWORD secret as the password."

          while ($true) {
            Write-Host "RDP session active: $(Get-Date)"
            Start-Sleep -Seconds 300
          } 
